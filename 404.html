<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Chong Min</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #181818; --fg: #FFFFFF; --muted: #9B9B9B; --accent: #2fbf85; --ease: cubic-bezier(0.32, 0.72, 0, 1); }
    body {
      background: var(--bg); color: var(--fg); font-family: 'Manrope', sans-serif;
      font-size: 14px; line-height: 20px; min-height: 100dvh;
      display: grid; place-items: center; padding: 16px;
    }
    main { max-width: 480px; }
    p.code { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--accent); margin-bottom: 16px; }
    h1 { font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px; text-wrap: balance; }
    p { color: var(--muted); margin-bottom: 32px; }
    a {
      display: inline-block; font-weight: 600; color: var(--bg); background: var(--accent);
      padding: 8px 12px; border-radius: 4px; text-decoration: none;
      transition: transform 700ms var(--ease), background-color 300ms var(--ease);
    }
    a:hover { background: #25a06d; transform: translateY(-4px); }
    a:active { transform: translateY(1px) scale(0.98); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">// 404</p>
    <h1>This page doesn't exist.</h1>
    <p>The link may be old, or the address may have a typo.</p>
    <a href="/">Back to the homepage</a>
  </main>
</body>
</html>
